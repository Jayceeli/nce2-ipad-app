<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="英语学习">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>英语学习 · 设置</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/extra.css">
  <script src="assets/progress.js" defer></script>
  <script src="assets/favorites.js" defer></script>
  <script src="assets/settings.js" defer></script>
  <script src="assets/register-sw-v8.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="hero compact">
      <h1>设置</h1>
      <p><a class="btn" href="index.html">返回教材选择</a></p>
    </header>
    <div class="page-card">
      <div class="card-box">
        <h2>NCE2 离线音频</h2>
        <p id="cacheStatus">正在统计已缓存音频…</p>
        <p class="muted">NCE2 共 96 课，音频约 162 MB。下载时请保持本页打开；iPad 会尝试保持亮屏，中断后可继续下载剩余课程。</p>
        <p id="storageStatus" class="muted"></p>
        <button id="preloadAll" class="btn">预下载全部 NCE2 音频</button>
        <progress id="preloadBar" class="offline-progress" max="96" value="0" hidden></progress>
        <div id="preloadProgress" class="dict-progress" aria-live="polite"></div>
      </div>
      <div class="card-box">
        <h2>上海五年级上英语</h2>
        <p>当前五年级模块使用已校对的教材数据和出版社原版音频，点读音频在线加载；不会调用系统 TTS 或合成语音。</p>
        <p class="muted">后续可以再把五年级原版音频加入本 App 的离线下载管理。</p>
      </div>
      <div class="card-box">
        <h2>学习数据</h2>
        <div class="dict-actions">
          <button id="exportData" class="btn">导出数据</button>
          <label class="btn" for="importFile">导入数据<input id="importFile" type="file" accept="application/json" hidden></label>
          <button id="clearData" class="btn" style="border-color:#b91c1c;color:#b91c1c">清除学习记录</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
